# Settings for build-image.sh. Sourced as shell variables.

# Release label, shown on the OLED and at login ("<label> <date>").
RELEASE_LABEL=release

# Output file name without .img.xz. Empty: mbot-server-24.04.3-<date>-<label>.
OUTPUT_NAME=2026-10-22-MBOT-UBUNTU-SERVER_IMAGE

# Default user. Same name and password as the current course image, which the course
# setup guide publishes (mbot-system-setup-Pi5.md). This is a public course default,
# not a personal credential. Whether the image should keep a shared default password is
# open policy question Q10 (docs/build-notes.md).
MBOT_USER=mbot
MBOT_DEFAULT_PASSWORD='i<3robots!'

# flash-kernel needs a machine name inside the chroot (no /proc/device-tree there).
FK_MACHINE='Raspberry Pi 5 Model B Rev 1.0'
