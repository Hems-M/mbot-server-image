# MBot server image cloud-init settings (OS-005).
# cloud-init stays for first boot: it grows the root partition to the SD card size and
# creates new SSH host keys on every newly flashed card.
# Installed to /etc/cloud/cloud.cfg.d/90-mbot.cfg.

# The mbot user is created when the image is built. Do not create the "ubuntu" user.
users: []
# mbot-start-network sets the hostname from /boot/firmware/mbot_config.txt.
preserve_hostname: true
# Students log in with a password (policy question Q10).
ssh_pwauth: true
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
# Netplan configuration comes from the image (/etc/netplan/01-mbot-network-manager.yaml).
network:
  config: disabled
